name: Đồng bộ Tour & Services từ SGT API
on:
  schedule:
    - cron: "17 20 * * *"   # 03:17 giờ Việt Nam mỗi ngày
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy dữ liệu
        env:
          SGT_CLIENT_ID: ${{ secrets.SGT_CLIENT_ID }}
          SGT_CLIENT_SECRET: ${{ secrets.SGT_CLIENT_SECRET }}
          SGT_API_BASE: ${{ vars.SGT_API_BASE || 'https://api.saigontourist.net' }}
        run: node scripts/sync-sgt.mjs && node scripts/build-sgt-app.mjs
      - name: Upload sgt-app lên Firebase Storage
        uses: google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23 # v2
        with:
          path: data/sgt-app.json
          destination: sgt-tour-creator.firebasestorage.app/data
          credentials: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy lên Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sgt-tour-creator
